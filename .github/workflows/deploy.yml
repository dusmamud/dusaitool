name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate missing og images (self-healing)
        run: |
          python -m pip install --quiet pillow numpy
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-core
          python -c "from PIL import features; print('raqm:', features.check('raqm'))"
          fc-list | grep -i devanagari || true
          python scripts/generate_og.py all
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Build (Astro + Pagefind search index)
        run: npm run build
      - name: Deploy dist to Cloudflare Pages
        run: npx wrangler pages deploy dist --project-name=dusaitool --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
